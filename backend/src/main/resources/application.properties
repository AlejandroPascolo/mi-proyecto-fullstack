# URL de conexión a SQL Server (ajusta servidor, puerto y nombre de la BD al tuyo):
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MiBaseDatos

# Usuario de SQL Server
spring.datasource.username=TU_USUARIO_SQLSERVER

# Contraseña de SQL Server
spring.datasource.password=TU_CONTRASEÑA_SQLSERVER

# Hibernate actualizará (create/update) las tablas automáticamente según el modelo
spring.jpa.hibernate.ddl-auto=update

# Mostrar consultas SQL en consola
spring.jpa.show-sql=true

# Dialecto de SQL Server para Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Puerto en el que corre el backend
server.port=8080
