# ===============================
# Configuración de conexión JDBC
# ===============================

# Conexión a SQL Server en localhost, puerto 1433,
# usando Windows Authentication (integratedSecurity).
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Productos;integratedSecurity=true

# Al usar integratedSecurity, no se especifican usuario/clave:
spring.datasource.username=
spring.datasource.password=

# Driver JDBC de Microsoft para SQL Server
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Dialecto de Hibernate para SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# (Opcional) Mostrar SQL en consola
spring.jpa.show-sql=true

# (Opcional) Para auto‐crear/actualizar esquema:
# spring.jpa.hibernate.ddl-auto=update

# ===============================
# Fin de application.properties
# ===============================
